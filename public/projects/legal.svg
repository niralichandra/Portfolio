<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="warm" cx="75%" cy="20%" r="60%"><stop offset="0" stop-color="#e8533a" stop-opacity=".4"/><stop offset="1" stop-color="#e8533a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx="15%" cy="95%" r="50%"><stop offset="0" stop-color="#00d4ff" stop-opacity=".18"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#e8533a"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="460" fill="#070707"/>
  <rect width="1200" height="460" fill="url(#warm)"/>
  <rect width="1200" height="460" fill="url(#cool)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- scales of justice, faint -->
  <g fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3" transform="translate(1010 40)">
    <path d="M80 10V230M20 60H140M80 230H30M80 230H130"/>
    <path d="M20 60L-10 140H50ZM140 60L110 140H170Z"/>
    <circle cx="80" cy="10" r="8"/>
  </g>

  <!-- long judgement: stacked pages -->
  <g transform="rotate(-6 330 230)">
    <rect x="215" y="85" width="230" height="300" rx="10" fill="url(#page)" stroke="#fff" stroke-opacity=".08"/>
  </g>
  <g transform="rotate(-2 330 230)">
    <rect x="225" y="78" width="230" height="300" rx="10" fill="url(#page)" stroke="#fff" stroke-opacity=".1"/>
  </g>
  <g>
    <rect x="235" y="72" width="230" height="300" rx="10" fill="url(#page)" stroke="#fff" stroke-opacity=".16"/>
    <text x="255" y="102" font-size="10" fill="#e8533a" letter-spacing="1.5">SUPREME COURT · JUDGEMENT</text>
    <g fill="#fff" fill-opacity=".14">
      <rect x="255" y="118" width="190" height="6" rx="3"/><rect x="255" y="132" width="170" height="6" rx="3"/><rect x="255" y="146" width="185" height="6" rx="3"/>
      <rect x="255" y="160" width="150" height="6" rx="3"/><rect x="255" y="174" width="190" height="6" rx="3"/><rect x="255" y="188" width="176" height="6" rx="3"/>
      <rect x="255" y="216" width="190" height="6" rx="3"/><rect x="255" y="230" width="160" height="6" rx="3"/><rect x="255" y="244" width="182" height="6" rx="3"/>
      <rect x="255" y="258" width="190" height="6" rx="3"/><rect x="255" y="286" width="170" height="6" rx="3"/><rect x="255" y="300" width="188" height="6" rx="3"/>
      <rect x="255" y="314" width="140" height="6" rx="3"/><rect x="255" y="328" width="182" height="6" rx="3"/><rect x="255" y="342" width="120" height="6" rx="3"/>
    </g>
    <!-- key passages the model picks out -->
    <rect x="251" y="156" width="160" height="14" rx="3" fill="#e8533a" fill-opacity=".28"/>
    <rect x="251" y="240" width="190" height="14" rx="3" fill="#e8533a" fill-opacity=".28"/>
    <rect x="251" y="296" width="196" height="14" rx="3" fill="#00d4ff" fill-opacity=".2"/>
    <text x="445" y="364" font-size="10" fill="#888" text-anchor="end">p. 1 / 142</text>
  </g>

  <!-- AI condensing -->
  <g fill="none" stroke="url(#flow)" stroke-width="3" filter="url(#glow)">
    <path d="M480 160C560 160 560 200 640 200"/>
    <path d="M480 245C560 245 560 220 640 220"/>
    <path d="M480 300C560 300 560 240 640 240"/>
  </g>
  <g transform="translate(560 190)">
    <rect x="-46" y="-18" width="92" height="36" rx="18" fill="#0a0a0a" stroke="#e8533a" stroke-opacity=".8"/>
    <text x="0" y="5" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1">✦ AI</text>
  </g>

  <!-- summary card -->
  <g>
    <rect x="660" y="110" width="320" height="250" rx="14" fill="#0b0b0b" stroke="#e8533a" stroke-opacity=".55"/>
    <text x="684" y="142" font-size="12" fill="#e8533a" letter-spacing="2.5">SUMMARY</text>
    <text x="960" y="142" font-size="11" fill="#888" text-anchor="end">142 pp → 6 lines</text>
    <g fill="#fff">
      <rect x="684" y="160" width="270" height="7" rx="3.5" fill-opacity=".85"/>
      <rect x="684" y="176" width="236" height="7" rx="3.5" fill-opacity=".85"/>
      <rect x="684" y="192" width="256" height="7" rx="3.5" fill-opacity=".85"/>
      <rect x="684" y="208" width="180" height="7" rx="3.5" fill-opacity=".85"/>
    </g>
    <line x1="684" y1="232" x2="956" y2="232" stroke="#fff" stroke-opacity=".1"/>
    <text x="684" y="256" font-size="11" fill="#00d4ff" letter-spacing="2">PRECEDENTS</text>
    <g font-size="11" fill="#ccc">
      <rect x="684" y="268" width="128" height="26" rx="13" fill="none" stroke="#fff" stroke-opacity=".18"/><text x="698" y="285">Civil · 2017</text>
      <rect x="820" y="268" width="134" height="26" rx="13" fill="none" stroke="#fff" stroke-opacity=".18"/><text x="834" y="285">Criminal · 2019</text>
      <rect x="684" y="302" width="144" height="26" rx="13" fill="none" stroke="#e8533a" stroke-opacity=".6"/><text x="698" y="319" fill="#fff">Constitutional</text>
      <text x="842" y="319" fill="#888">+ 4 more</text>
    </g>
  </g>
</svg>
